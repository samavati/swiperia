name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Preview the release without publishing'
        type: boolean
        default: true

permissions:
  contents: write # push the version commit, tag and GitHub release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The branch ruleset on main requires pull requests and signed commits,
      # which the version commit nx release pushes is neither. Rather than
      # exempting every write collaborator, the bypass list names this app
      # alone, and its installation token lasts only for this job.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # nx release reads the tag history
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t lint test build typecheck

      # Fails the release if a tarball would be unusable for any consumer:
      # publint checks the package shape, attw checks that types resolve under
      # node10 / node16-CJS / node16-ESM / bundler.
      - name: Verify package shape
        run: pnpm verify-packaging

      - name: Configure git
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}

      # Authenticates to npm through OIDC trusted publishing: the `id-token`
      # permission above lets pnpm exchange a short-lived GitHub token for a
      # publish grant, so there is no npm token to store or rotate. Each package
      # trusts samavati/swiperia + this workflow filename, so renaming this file
      # breaks publishing until the trusted publishers are updated.
      - name: Release
        run: pnpm nx release ${{ inputs.dryRun && '--dry-run' || '--yes' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
